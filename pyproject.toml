    "samples/python/agents/advanced/ag2",
    "samples/python/agents/advanced/any_agent_adversarial_multiagent",
    "samples/python/agents/advanced/a2a_telemetry",
    "samples/python/agents/advanced/a2a_mcp",
    "samples/python/agents/advanced/airbnb_planner_multiagent",
    "samples/python/agents/advanced/azureaifoundry_sdk",
    "samples/python/agents/advanced/mindsdb",
    "samples/python/agents/advanced/headless_agent_auth",

    # Beginner hosts
    "samples/python/hosts/beginner/cli",
    "samples/python/hosts/beginner/beeai-chat",
    "samples/python/hosts/beginner/multiagent",

    # Intermediate hosts
    "samples/python/hosts/intermediate/a2a_gui",

    # Advanced hosts
    "samples/python/hosts/advanced/a2a_multiagent_host",
    "samples/python/hosts/advanced/content_creation",
    "samples/python/hosts/advanced/weather_and_airbnb_planner",

    # Extensions
    "samples/python/extensions/timestamp",

    # Demo
    "demo/ui",
