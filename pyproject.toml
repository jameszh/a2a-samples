[project]
name = "a2a-samples-workspace"
version = "0.1.0"
description = "Agent2Agent samples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    # Beginner agents
    "samples/python/agents/beginner/helloworld",
    "samples/python/agents/beginner/number_guessing_game",
    "samples/python/agents/beginner/dice_agent_rest",
    "samples/python/agents/beginner/dice_agent_grpc",
    "samples/python/agents/beginner/a2a-mcp-without-framework",
    "samples/python/agents/beginner/adk_facts",
    "samples/python/agents/beginner/travel_planner_agent",
    "samples/python/agents/beginner/birthday_planner_adk",

    # Intermediate agents
    "samples/python/agents/intermediate/langgraph",
    "samples/python/agents/intermediate/crewai",
    "samples/python/agents/intermediate/llama_index_file_chat",
    "samples/python/agents/intermediate/adk_expense_reimbursement",
    "samples/python/agents/intermediate/semantickernel",
    "samples/python/agents/intermediate/marvin",
    "samples/python/agents/intermediate/analytics",
    "samples/python/agents/intermediate/veo_video_gen",
    "samples/python/agents/intermediate/github-agent",
    "samples/python/agents/intermediate/content_planner",
    "samples/python/agents/intermediate/adk_cloud_run",

