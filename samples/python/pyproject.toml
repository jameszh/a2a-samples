[project]
name = "a2a-samples"
version = "0.1.0"
description = "Agent2Agent samples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.3.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "jwcrypto>=1.5.6",
    "pydantic>=2.11.0",
    "pyjwt>=2.10.1",
    "sse-starlette>=2.2.1",
    "starlette>=0.46.1",
    "typing-extensions>=4.12.2",
    "uvicorn>=0.34.0",
    "veo-video-sample-agent",
]

[tool.hatch.build.targets.wheel]
packages = ["common", "hosts"]

[tool.uv.workspace]
members = [
    # Beginner agents
    "agents/beginner/helloworld",
    "agents/beginner/number_guessing_game",
    "agents/beginner/dice_agent_rest",
    "agents/beginner/dice_agent_grpc",
    "agents/beginner/a2a-mcp-without-framework",
    "agents/beginner/adk_facts",
    "agents/beginner/travel_planner_agent",
    "agents/beginner/birthday_planner_adk",

    # Intermediate agents
    "agents/intermediate/langgraph",
    "agents/intermediate/crewai",
    "agents/intermediate/llama_index_file_chat",
    "agents/intermediate/adk_expense_reimbursement",
    "agents/intermediate/semantickernel",
    "agents/intermediate/marvin",
    "agents/intermediate/analytics",
    "agents/intermediate/veo_video_gen",
    "agents/intermediate/github-agent",
    "agents/intermediate/content_planner",
    "agents/intermediate/adk_cloud_run",

    # Advanced agents
    "agents/advanced/ag2",
    "agents/advanced/any_agent_adversarial_multiagent",
    "agents/advanced/a2a_telemetry",
    "agents/advanced/a2a_mcp",
    "agents/advanced/airbnb_planner_multiagent",
    "agents/advanced/azureaifoundry_sdk",
    "agents/advanced/mindsdb",
    "agents/advanced/headless_agent_auth",

    # Beginner hosts
    "hosts/beginner/cli",
    "hosts/beginner/beeai-chat",
    "hosts/beginner/multiagent",

    # Intermediate hosts
    "hosts/intermediate/a2a_gui",

    # Advanced hosts
    "hosts/advanced/a2a_multiagent_host",
    "hosts/advanced/content_creation",
    "hosts/advanced/weather_and_airbnb_planner",

    # Extensions
    "extensions/timestamp",
    "extensions/traceability",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
veo-video-sample-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3.5", "pytest-mock>=3.14.0", "ruff>=0.12.8"]
